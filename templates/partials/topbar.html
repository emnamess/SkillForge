<header class="topbar">
    <form class="search" action="{% url 'courses:index' %}" method="get">
        <input type="search" name="q" placeholder="Rechercher un cours, un module...">
    </form>
    <div class="topbar-right">
        {# Emplacement de la cloche de notifications (module notifications) #}
        {% block topbar_notifications %}{% endblock %}
        <div class="user-chip">
            <span class="avatar">{{ user.initiales }}</span>
            <span class="user-chip-text">
                <strong>{{ user }}</strong>
                <small>{{ user.get_role_display }}</small>
            </span>
        </div>
    </div>
</header>
