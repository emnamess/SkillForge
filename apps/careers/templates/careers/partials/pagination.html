{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
    {% if page.has_previous %}<a href="?{% if params %}{{ params }}&{% endif %}page={{ page.previous_page_number }}" class="btn btn-sm btn-outline">Précédent</a>{% endif %}
    <span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?{% if params %}{{ params }}&{% endif %}page={{ page.next_page_number }}" class="btn btn-sm btn-outline">Suivant</a>{% endif %}
</nav>
{% endif %}
